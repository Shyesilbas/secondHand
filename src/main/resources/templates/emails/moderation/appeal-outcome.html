<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layout.html :: page(title='İtiraz Sonucu', body=~{::section}, actionUrl='/complaints', actionText='Şikayetlerimi Gör')}">
<body>
<section>
    <p th:if="${approved}">İtirazınız incelendi ve kabul edildi.<span th:if="${penaltyReversed}"> Uygulanan yaptırım iptal edildi.</span></p>
    <p th:unless="${approved}">İtirazınız incelendi ve reddedildi. Karar kesinleşmiştir; bu karar için yeni bir itiraz açılamaz.</p>
    <table class="details" role="presentation">
        <tr><td class="label">Şikayet No</td><td class="value" th:text="${complaintId}">-</td></tr>
    </table>
    <div class="note" th:if="${explanation != null}"><div class="note-title">Aura İtiraz Değerlendirmesi</div><span th:text="${explanation}">-</span></div>
</section>
</body>
</html>
