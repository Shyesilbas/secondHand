<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layout.html :: page(title='Şikayetiniz Sonuçlandı', body=~{::section}, actionUrl='/complaints', actionText='Şikayetlerimi Gör')}">
<body>
<section>
    <p>Şikayetiniz incelendi ve topluluk kurallarına aykırı bir durum tespit edildi. Şikayet edilen kullanıcı hakkında gerekli işlem yapıldı.</p>
    <table class="details" role="presentation">
        <tr><td class="label">Şikayet No</td><td class="value" th:text="${complaintId}">-</td></tr>
        <tr th:if="${targetLabel != null}"><td class="label">Şikayet Edilen</td><td class="value" th:text="${targetLabel}">-</td></tr>
        <tr th:if="${resolvedAt != null}"><td class="label">Sonuç Tarihi</td><td class="value" th:text="${resolvedAt}">-</td></tr>
    </table>
    <div class="note" th:if="${adminNotes != null}"><div class="note-title">Aura Güvenlik Raporu</div><span th:text="${adminNotes}">-</span></div>
    <p>Platformu güvenli tutmamıza katkı sağladığınız için teşekkür ederiz.</p>
</section>
</body>
</html>
