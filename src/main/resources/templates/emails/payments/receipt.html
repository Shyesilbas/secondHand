<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layout.html :: page(title=(${headerTitle} ?: 'Ödeme Başarılı'), body=~{::section}, actionUrl=${actionUrl}, actionText=(${actionText} ?: 'Ödemelerimi Gör'))}">
<body>
<section>
    <p th:if="${!#strings.isEmpty(message)}" th:text="${message}">İşleminiz tamamlandı.</p>
    <div class="amount" th:if="${!#strings.isEmpty(amount)}">
        <div class="amount-label" th:text="${amountLabel} ?: 'Tutar'">Tutar</div>
        <div class="amount-value" th:text="${amount} + ' ' + (${currency} ?: 'TRY')">0,00 TRY</div>
    </div>
    <table class="details" role="presentation">
        <tr th:if="${!#strings.isEmpty(typeLabel)}"><td class="label">İşlem</td><td class="value" th:text="${typeLabel}">Ürün Satın Alma</td></tr>
        <tr th:if="${!#strings.isEmpty(listingTitle)}"><td class="label">İlan</td><td class="value" th:text="${listingTitle}">İlan başlığı</td></tr>
        <tr th:if="${!#strings.isEmpty(paymentMethod)}"><td class="label">Ödeme Yöntemi</td><td class="value" th:text="${paymentMethod}">E-Cüzdan</td></tr>
        <tr th:if="${!#strings.isEmpty(transactionDate)}"><td class="label">Tarih</td><td class="value" th:text="${transactionDate}">24.08.2026 17:00</td></tr>
        <tr th:if="${!#strings.isEmpty(transactionNumber)}"><td class="label">İşlem Referansı</td><td class="value" th:text="${transactionNumber}">A1B2C3D4</td></tr>
    </table>
</section>
</body>
</html>
