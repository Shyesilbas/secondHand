<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layout.html :: page(title=(${headerTitle} ?: 'Teklifiniz Kabul Edildi'), body=~{::section}, actionUrl='/offers', actionText='Tekliflerime Git')}">
<body>
<section>
    <p th:text="${headline} ?: 'Teklifiniz kabul edildi.'">Teklifiniz kabul edildi.</p>
    <div class="amount">
        <div class="amount-label">Anlaşılan Tutar</div>
        <div class="amount-value" th:text="${totalPrice}">0,00 TRY</div>
    </div>
    <table class="details" role="presentation">
        <tr th:if="${!#strings.isEmpty(listingTitle)}"><td class="label">İlan</td><td class="value" th:text="${listingTitle}">İlan başlığı</td></tr>
        <tr th:if="${quantity != null and quantity > 1}"><td class="label">Adet</td><td class="value" th:text="${quantity}">2</td></tr>
        <tr th:if="${quantity != null and quantity > 1 and !#strings.isEmpty(unitPrice)}"><td class="label">Birim Fiyat</td><td class="value" th:text="${unitPrice}">0,00 TRY</td></tr>
        <tr th:if="${!#strings.isEmpty(expiresAt)}"><td class="label">Son Geçerlilik</td><td class="value" th:text="${expiresAt}">16.11.2026 14:00</td></tr>
    </table>
    <p th:if="${!#strings.isEmpty(nextStep)}" th:text="${nextStep}">Sıradaki adım</p>
</section>
</body>
</html>
