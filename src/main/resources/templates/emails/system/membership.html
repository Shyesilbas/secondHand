<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layout.html :: page(title='Premium Üyeliğiniz Aktif', body=~{::section}, actionUrl='/profile', actionText='Profilimi Görüntüle')}">
<body>
<section>
    <p>Premium üyeliğiniz aktif edildi.</p>
    <table class="details" role="presentation">
        <tr th:if="${!#strings.isEmpty(amount)}"><td class="label">Ödenen Tutar</td><td class="value" th:text="${amount}">100,00 TRY</td></tr>
        <tr th:if="${!#strings.isEmpty(date)}"><td class="label">Başlangıç</td><td class="value" th:text="${date}">22.06.2026 15:00</td></tr>
        <tr th:if="${!#strings.isEmpty(expiryDate)}"><td class="label">Bitiş</td><td class="value" th:text="${expiryDate}">22.07.2026 15:00</td></tr>
        <tr th:if="${!#strings.isEmpty(paymentId)}"><td class="label">İşlem Referansı</td><td class="value" th:text="${paymentId}">A1B2C3D4</td></tr>
    </table>
    <th:block th:if="${benefits != null and !#lists.isEmpty(benefits)}">
        <p class="section-title">Premium Avantajlarınız</p>
        <table class="details" role="presentation">
            <tr th:each="benefit : ${benefits}"><td th:text="${benefit}">Avantaj</td></tr>
        </table>
    </th:block>
</section>
</body>
</html>
