<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${headerTitle != null ? headerTitle : 'Oturum Güvenlik Bildirimi'}">Oturum Güvenlik Bildirimi</title>
    <style>
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 0; color: #0f172a; font-size: 14px; line-height: 1.6; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
        .container { max-width: 640px; margin: 0 auto; padding: 18px 24px; background-color: #ffffff; }
        .header { padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
        .brand-name { font-size: 12px; font-weight: 500; color: #64748b; margin-bottom: 4px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a; }
        .content { color: #334155; font-size: 14px; line-height: 1.6; }
        .content p { margin: 0 0 10px 0; font-size: 14px; }
        .greeting { font-weight: 600; color: #0f172a; }
        .highlight { font-weight: 600; color: #0f172a; }
        .button { display: inline-block; background-color: #0f172a; color: #ffffff !important; text-decoration: none; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; margin-top: 8px; }
        .signoff { margin-top: 14px; border-top: 1px solid #f1f5f9; padding-top: 10px; font-size: 13px; color: #475569; }
        .footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid #f1f5f9; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand-name">SecondHand Hesap Güvenliği</div>
            <h1 th:text="${headerTitle != null ? headerTitle : 'Oturum Güvenlik Bildirimi'}">Oturum Güvenlik Bildirimi</h1>
        </div>
        <div class="content">
            <p class="greeting" th:text="#{email.body.hello(${userName})}">Merhaba Kullanıcı,</p>
            <div th:utext="${message}" style="white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #334155; margin-bottom: 10px;">Mesaj içeriği burada yer alacak.</div>

            <p th:if="${actionUrl != null}">
                <a th:href="${actionUrl}" class="button" th:text="${actionText != null ? actionText : 'Güvenlik Ayarlarını İncele'}">Güvenlik Ayarlarını İncele</a>
            </p>

            <p class="signoff" th:utext="#{email.body.team}">Saygılarımızla,<br><strong style="color: #0f172a; font-weight: 600;">SecondHand Ekibi</strong></p>
        </div>
        <div class="footer">
            &copy; 2026 SecondHand Pazaryeri. Tüm hakları saklıdır.
        </div>
    </div>
</body>
</html>
