<!DOCTYPE html>
<!--
  Shared shell for every email. A template passes its title, its body markup and an optional
  call-to-action; all styling lives here so the templates carry content only.
-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, body, actionUrl, actionText)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">SecondHand</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAFAF9;
            margin: 0;
            padding: 24px 16px;
            color: #44403C;
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #FFFFFF;
            border: 1px solid #E7E5E4;
            border-radius: 8px;
            overflow: hidden;
        }
        .header { padding: 24px 28px 0 28px; }
        .brand {
            margin: 0 0 6px 0;
            font-size: 13px;
            font-weight: 600;
            color: #78716C;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            line-height: 1.3;
            color: #1C1917;
        }
        .content { padding: 20px 28px 24px 28px; }
        .content p { margin: 0 0 12px 0; }
        .greeting { font-weight: 600; color: #1C1917; }
        .muted { font-size: 13px; color: #78716C; }
        .message { margin: 0 0 12px 0; }

        .amount { margin: 16px 0 4px 0; }
        .amount-label { font-size: 13px; color: #78716C; }
        .amount-value {
            font-size: 26px;
            font-weight: 600;
            line-height: 1.3;
            color: #0F766E;
            font-variant-numeric: tabular-nums;
        }

        table.details {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 16px 0;
        }
        table.details td {
            padding: 9px 0;
            font-size: 14px;
            border-bottom: 1px solid #E7E5E4;
            vertical-align: top;
        }
        table.details tr:last-child td { border-bottom: none; }
        table.details td.label { color: #78716C; padding-right: 16px; }
        table.details td.value {
            color: #1C1917;
            font-weight: 600;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        table.details tr.total td {
            border-top: 1px solid #D6D3D1;
            border-bottom: none;
            color: #1C1917;
            font-weight: 600;
        }
        .section-title {
            margin: 20px 0 0 0;
            font-size: 14px;
            font-weight: 600;
            color: #1C1917;
        }

        .note {
            margin: 16px 0;
            padding: 2px 0 2px 14px;
            border-left: 2px solid #D6D3D1;
            color: #44403C;
        }
        .note-title { font-weight: 600; color: #1C1917; }
        .note-warning { border-left-color: #D97706; }

        .code { margin: 16px 0; }
        .code-label { font-size: 13px; color: #78716C; }
        .code-value {
            display: inline-block;
            margin: 6px 0;
            padding: 10px 18px;
            border: 1px solid #D6D3D1;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: #1C1917;
            font-variant-numeric: tabular-nums;
        }
        .code-hint { font-size: 13px; color: #78716C; }

        .listing { margin: 16px 0; }
        .listing img {
            display: block;
            width: 96px;
            height: 96px;
            margin-bottom: 10px;
            border-radius: 8px;
            object-fit: cover;
        }
        .listing-title { font-weight: 600; color: #1C1917; }
        .listing-price { font-weight: 600; color: #0F766E; font-variant-numeric: tabular-nums; }

        .button {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #292524;
            color: #FFFFFF !important;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .signoff {
            margin: 24px 0 0 0 !important;
            padding-top: 16px;
            border-top: 1px solid #E7E5E4;
            font-size: 13px;
            color: #57534E;
        }
        .signoff strong { color: #1C1917; font-weight: 600; }
        .footer {
            padding: 14px 28px;
            border-top: 1px solid #E7E5E4;
            background-color: #FAFAF9;
            font-size: 12px;
            color: #78716C;
        }
        @media (max-width: 640px) {
            body { padding: 12px 8px; }
            .header { padding: 20px 18px 0 18px; }
            .content { padding: 16px 18px 20px 18px; }
            .footer { padding: 12px 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <p class="brand">SecondHand</p>
            <h1 th:text="${title}">Bildirim</h1>
        </div>
        <div class="content">
            <p class="greeting" th:text="#{email.body.hello(${userName})}">Merhaba,</p>
            <th:block th:replace="${body}" />
            <p th:if="${actionUrl != null}">
                <a class="button" th:href="${actionUrl}" th:text="${actionText}">Detayları Gör</a>
            </p>
            <p class="signoff" th:utext="#{email.body.team}">Saygılarımızla,<br><strong>SecondHand Ekibi</strong></p>
        </div>
        <div class="footer" th:text="#{email.footer.copyright}">SecondHand Pazaryeri</div>
    </div>
</body>
</html>
