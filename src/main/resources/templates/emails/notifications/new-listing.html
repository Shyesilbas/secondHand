<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{emails/layout.html :: page(title=(${headerTitle} ?: 'Yeni Bir İlan Eklendi'), body=~{::section}, actionUrl=${listingUrl}, actionText='İlanı Görüntüle')}">
<body>
<section>
    <p th:text="${introText} ?: 'Takip ettiğiniz satıcı yeni bir ilan paylaştı:'">Takip ettiğiniz satıcı yeni bir ilan paylaştı:</p>
    <div class="listing">
        <img th:if="${!#strings.isEmpty(listingImage)}" th:src="${listingImage}" alt="">
        <div class="listing-title" th:text="${listingTitle}">İlan başlığı</div>
        <div class="listing-price" th:text="${listingPrice}">0,00 TRY</div>
        <div class="muted" th:if="${!#strings.isEmpty(listingCity)}" th:text="${listingCity}">İstanbul</div>
    </div>
    <p class="muted" th:if="${!#strings.isEmpty(manageNotificationText)}" th:text="${manageNotificationText}">Bildirim ayarı</p>
</section>
</body>
</html>
