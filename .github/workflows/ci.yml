name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run unit tests and generate JaCoCo report
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  frontend-and-verify:
    name: Frontend Build, Lint & Repo Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: secondhand-frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        working-directory: secondhand-frontend
        run: npm ci

      - name: Build frontend
        working-directory: secondhand-frontend
        run: npm run build

      - name: Run repository consistency and lint checks
        run: ./scripts/verify.sh

      - name: Build the project report (fails when its facts drift from the code)
        run: |
          pip install -r scripts/project_report/requirements.txt
          python3 scripts/project_report/build_project_report.py "$RUNNER_TEMP/project_report.pdf"

      - name: Remind which docs may need an update
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_docs.py --changed=origin/${{ github.base_ref }}
